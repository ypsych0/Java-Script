<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de idade</title>
</head>
<body>
    <script>
        let nomePessoa = prompt("Entre com o seu nome:");
        let anoNascimento = Number(prompt("Entre com o ano do seu nascimento:"));
        let anoAtual = Number(prompt("Entre com o ano atual:"));
        let idade = anoAtual - anoNascimento;
        alert(`${nomePessoa} a sua idade é ${idade} anos`);
    </script>
</body>
</html>
