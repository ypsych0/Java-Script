<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de conta de cliente</title>
</head>
<body>
    <script>
        let nomeCliente = prompt("Entre com o seu nome:");
        let totalConta = Number(prompt("Entre com o total da conta:"));
        let valorPago = Number(prompt("Entre com o valor pago:"));
        let troco = valorPago - totalConta;
        alert(`${nomeCliente} o seu troco é ${troco} reais`);
    </script>
</body>
</html>
