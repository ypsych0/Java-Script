<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>Função</title>
    <meta charset="utf-8">
</head>

<body>
    <script type="text/javascript">
        const calcularMedia = (valor1, valor2) => {
            let resultado = (valor1 + valor2) / 2;
            return resultado;
        }
        const definirSituacao = (media) => {
            if (media >= 7) {
                return "Aprovado!";
            } else if (media >= 5) {
                return "Recuperação";
            } else {
                return "Reprovado";
            }
        }
        let nome = prompt("Informe o nome do aluno:");
        let nota1 = prompt("Informe a primeira nota do aluno:");
        let nota2 = prompt("Informe a segunda nota do aluno:");
        media = calcularMedia(Number(nota1), Number(nota2));
        alert(`O aluno ${nome} teve média de ${media}`);
        alert(`Você está ${definirSituacao(media)}`);
    </script>
</body>

</html>
